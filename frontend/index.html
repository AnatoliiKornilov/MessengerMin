<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Min</title>

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="auth-screen" class="screen auth-screen">
    <div class="auth-form">
      <div id="login-block">
        <h2>С возвращением</h2>

        <input type="text" id="login-username" placeholder="Имя" required>
        <input type="password" id="login-password" placeholder="Пароль" required>

        <button type="button" id="login-btn">Войти</button>

        <p class="toggle-link" id="toggle-to-register">Нет аккаунта? Зарегистрируйтесь</p>
      </div>

      <div id="register-block" class="hidden">
        <h2>Создать аккаунт</h2>

        <input type="text" id="reg-username" placeholder="Имя" required>
        <input type="password" id="reg-password" placeholder="Пароль" required>

        <button type="button" id="register-btn">Зарегистрироваться</button>
        
        <p class="toggle-link" id="toggle-to-login">Уже есть аккаунт? Войдите</p>
      </div>
    </div>
  </div>

  <div id="chat-screen" class="screen chat-screen hidden">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Min</h1>

        <div class="sidebar-actions">
          <button id="theme-toggle" title="Сменить тему">☀</button>
          <button id="new-personal-chat">+ ЛС</button>
          <button id="new-group">+ Группа</button>
          <button id="logout-btn" title="Выйти">↪</button>
        </div>
      </div>

      <ul class="chat-list" id="chat-list"></ul>
    </aside>

    <main class="chat-area">
      <div id="chat-header"></div>
      <div class="messages" id="messages"></div>

      <div class="input-area">
        <input type="text" id="message-input" placeholder="Введите сообщение...">
        <button id="send-btn">Отправить</button>
      </div>

    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
